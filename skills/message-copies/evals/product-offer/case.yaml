schema_version: "1.1"
name: product-offer
context:
  scaffold_script: place-files.sh
expected_outcome: |
  - Says the offer (a 30-minute demo of the platform) is the product and proposes a better offer, such as a dated session with peers, a request for help or a piece of work made for them, before or next to writing the product message
  - The first message gives a reason to write that is specific: a fact about the recipient (written as a blank to fill from their profile, tied to why the offer fits them) or one from the source (Ana's network or her years in HR at Grupo Bimbo); it does not open with a generic reason such as 'we help companies like yours'
  - The first message and each follow-up end with one question the reader can answer with a yes (the connection note needs no question), and none ends with a question about the reader's problem or how they handle it today
  - Invents no customer, result, event date or mutual contact that is not in the files
  - Replies in Spanish
