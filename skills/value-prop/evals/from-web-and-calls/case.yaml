schema_version: "1.1"
name: from-web-and-calls
context:
  scaffold_script: place-files.sh
expected_outcome: |
  - Reads .agents/icp.md and writes the value proposition for the wholesale distributors ICP
  - Writes the before in the customers' own words from the call notes (for example the brother-in-law calling clients every Monday), not in the website's words
  - Uses only real proof (Andina 52 to 34 days, Del Sur 3 people to 1) and points out that '18 days on average' rests on a single customer
  - Takes the time to first result from the notes (three old invoices collected in the first month), or leaves it open
  - Names the weakest of the four drivers
  - Lists at least 12 problems, each tagged with a driver and paired with a solution
  - Includes the prospects' objections (clients offended by reminders, no time to implement, a past system nobody used, not using Tango) as problems
  - Does not invent customers, numbers or quotes that are not in the files
  - Does not save .agents/value-prop.md before the user confirms the draft
  - Asks at most one question in the reply
  - Replies in Spanish
