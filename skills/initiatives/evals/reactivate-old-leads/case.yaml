schema_version: "1.1"
name: reactivate-old-leads
context:
  scaffold_script: place-files.sh
expected_outcome: |
  - Advises against sending the same sequence again to the same people
  - Proposes writing again only when something changed for each person (a new role, company news, a post), with that change as the reason
  - Proposes parking the leads with the date and the reason they did not move forward, or keeping that record
  - Proposes staying visible to them in the meantime without pitching, for example reacting to their posts on a set schedule
  - Replies in Spanish
